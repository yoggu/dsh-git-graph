# dsh-git-graph bundle layer.
#
# One host row. It resolves the repository of the calling Session's workspace,
# runs `git` read-only against it, and serves the answers on this package's own
# exact HTTP route. The browser half owns the rendering; it never runs git.
#
# Nothing here writes to a repository: no checkout, no commit, no fetch. The
# working-tree answer is a read of what a running agent left behind, which is
# the point — `git status` and `git diff` against HEAD describe the tree as it
# is at the moment of the request, never a cached snapshot of it.
- insert:
    - id: git-graph
      name: 'dsh-git-graph'
